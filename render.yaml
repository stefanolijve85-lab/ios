# Render Blueprint — Next.js verlichtingsapp.
# Let op: voor Philips Hue moet de app op je thuisnetwerk draaien (bijv. een
# Raspberry Pi of NAS) om de lokale Bridge te bereiken. Tuya/MiBoxer werkt ook
# vanuit de cloud.
services:
  - type: web
    name: huis-verlichting
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
