name: CI

# Build + math/fairness gates for the slot and crash titles.
on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Slot engine + fairness tests
        run: npm run test:slot

      - name: RTP smoke simulation (300k spins, must stay in band)
        run: node server/slot/simulate.js 300000 96

      - name: Build
        run: npm run build
