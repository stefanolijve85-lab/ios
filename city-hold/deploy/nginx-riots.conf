# RIOTS: a static site (the Vite build in dist/) served by the nginx that also runs Detepo and Kwizillo.
# No Node service: nginx serves the files itself. Replace riots.example.nl with the real hostname (twice).
#   sudo cp nginx-riots.conf /etc/nginx/sites-available/riots
#   sudo ln -s /etc/nginx/sites-available/riots /etc/nginx/sites-enabled/riots
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d riots.example.nl
server {
    listen 80;
    listen [::]:80;
    server_name riots.example.nl;

    root /var/www/riots;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # text compresses well; .glb models a little
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/manifest+json model/gltf-binary image/svg+xml;

    types { model/gltf-binary glb; application/manifest+json webmanifest; }

    # the page itself: always ask, so a new version shows up at once
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache" always; }

    # code and styles carry a content hash in their name: keep for a year
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

    # models, sounds, music, textures, the films and the menu art are asked for with ?v=<hash of all files>:
    # a new version gets a new address, so the browser may keep them for a long time
    location ~ ^/(models|audio|textures|menu|video|ui|env|fx)/ {
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    location / { try_files $uri $uri/ /index.html; }
}
